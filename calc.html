<!DOCTYPE html>
<html lang="en"> 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="./style1.css">
</head>
<body>
    <table border="solid" cellspacing="3">
        <tr id="screen">
            <td colspan="5" id="disp">0</td>
        </tr>
        <tr class="btns">
            <td><input type="button" value="ON" onclick="u_clear()"></td>
            <td><input type="button" value="MC" onclick="memoryClear()"></td>
            <td><input type="button" value="MR" onclick="memoryRecall()"></td>
            <td><input type="button" value="M-" onclick="memorySubtract()"></td>
            <td><input type="button" value="M+" onclick="memoryAdd()"></td>
        </tr>
        <tr class="btns">
            <td><input type="button" value="OFF" onclick="u_clear()"></td>
            <td><input type="button" value="%" onclick="percent()"></td>
            <td><input type="button" value="Sqrt" onclick="sqrt()"></td>
            <td><input type="button" value="+/-" onclick="toggleSign()"></td>
            <td><input type="button" value="AC" onclick="u_clear()"></td>
        </tr>
        <tr class="btns">
            <td><input type="button" value="7" onclick="display(7)"></td>
            <td><input type="button" value="8" onclick="display(8)"></td>
            <td><input type="button" value="9" onclick="display(9)"></td>
            <td><input type="button" value="X" onclick="display('*')"></td>
            <td><input type="button" value="CE" onclick="display('CE')"></td>
        </tr>
        <tr class="btns">
            <td><input type="button" value="4" onclick="display(4)"></td>
            <td><input type="button" value="5" onclick="display(5)"></td>
            <td><input type="button" value="6" onclick="display(6)"></td>
            <td><input type="button" value="-" onclick="display('-')"></td>
            <td><input type="button" value="/" onclick="display('/')"></td>
        </tr>
        <tr class="btns">
            <td><input type="button" value="1" onclick="display(1)"></td>
            <td><input type="button" value="2" onclick="display(2)"></td>
            <td><input type="button" value="3" onclick="display(3)"></td>
            <td rowspan="2"><input type="button" value="+" onclick="display('+')"></td>
            <td rowspan="2"><input type="button" value="=" onclick="calculate()"></td>
        </tr>
        <tr class="btns">
            <td colspan="2"><input type="button" value="0" onclick="display(0)"></td>
            <td><input type="button" value="." onclick="display('.')"></td>
        </tr> 
    </table>
    <script src="./script.js"></script>
</body>
</html>
